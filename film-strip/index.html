<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>On Film · Wander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0d0c0a;
    --rebate:#1c1a15;
    --rebate-2:#141210;
    --ink:#f2ece1;
    --ink-soft:rgba(242,236,225,0.72);
    --ink-faint:rgba(242,236,225,0.4);
    --amber:#e2a13a;
    --amber-deep:#a86a24;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    overflow-x:hidden;
  }
  a{ color:inherit; }

  /* ---------- nav (draft-page pattern, matches urotrip2026) ---------- */
  #top-pill-nav{
    position:fixed; top:20px; left:20px; z-index:20;
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 16px;
    background:rgba(28,26,21,0.7);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(242,236,225,0.1);
    border-radius:9999px;
    font-size:11px; letter-spacing:1px;
  }
  #top-pill-nav a{ text-decoration:none; color:var(--amber); text-transform:uppercase; font-weight:600; }
  #top-pill-nav a:hover{ color:#f0b559; }
  #top-pill-nav .slash{ color:#5a5650; }
  #top-pill-nav .current{ font-family:'Newsreader', serif; font-style:italic; color:var(--ink-faint); letter-spacing:0.3px; }

  #contact-badge{
    position:fixed; top:20px; right:20px; z-index:20;
    width:36px; height:36px;
    background:rgba(28,26,21,0.7);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(242,236,225,0.1);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; text-decoration:none;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  #contact-badge:hover{ transform:scale(1.08); border-color:rgba(242,236,225,0.3); }

  /* ---------- intro ---------- */
  .intro{
    max-width:520px; margin:0 auto;
    padding:96px 24px 8px;
    text-align:center;
  }
  .intro .eyebrow{
    font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--amber); margin:0 0 0.7rem;
  }
  .intro h1{
    font-family:'Newsreader', serif; font-weight:500; font-style:italic;
    font-size:clamp(1.7rem, 5vw, 2.3rem); line-height:1.15;
    margin:0 0 0.7rem; color:var(--ink);
  }
  .intro p{
    font-size:12px; line-height:1.7; color:var(--ink-soft); margin:0;
  }

  /* ---------- the strip ---------- */
  .strip-stage{
    position:relative;
    padding:48px 0 40px;
  }
  .strip-scroll{
    display:flex; align-items:stretch;
    gap:0;
    overflow-x:auto; overflow-y:hidden;
    padding:0 max(24px, calc(50vw - 110px)) 12px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
  }
  .strip-scroll::-webkit-scrollbar{ display:none; }
  .strip-scroll{ scrollbar-width:none; }

  .frame{
    flex:0 0 auto;
    width:184px;
    scroll-snap-align:center;
    background:var(--rebate);
    border-left:1px solid var(--rebate-2);
    padding:0 3px;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .frame:first-child{ border-left:none; }
  .frame:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

  .sprockets{
    height:14px;
    background-image:radial-gradient(circle at 7px 7px, var(--paper) 3.1px, transparent 3.2px);
    background-size:16px 14px;
    background-repeat:repeat-x;
    background-position:4px 0;
  }

  .edge-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:3px 8px 4px;
    font-size:8px; letter-spacing:0.6px;
    color:var(--amber-deep);
    transition:color 0.4s ease;
  }
  .frame--seen .edge-row{ color:var(--ink-faint); }
  .edge-row .num{ font-weight:700; }
  .edge-row .dot{ opacity:0; transition:opacity 0.3s ease; }
  .frame--seen .edge-row .dot{ opacity:1; }

  .frame-window{
    position:relative;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#000;
  }
  .frame-window img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:invert(0.92) hue-rotate(180deg) saturate(1.2) contrast(1.08) brightness(1.03);
  }
  .frame-window::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(198,120,38,0.4), rgba(110,52,16,0.24));
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .frame-window::before{
    content:"";
    position:absolute; inset:0; z-index:2;
    box-shadow:inset 0 0 0 1px rgba(242,236,225,0.06);
    pointer-events:none;
  }

  .strip-hint{
    text-align:center;
    font-size:10px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:4px;
    transition:opacity 0.6s ease;
  }

  /* ---------- lightbox: the loupe / developing tray ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(6,5,4,0.94);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transition:opacity 0.3s ease;
  }
  #lightbox.open{ opacity:1; pointer-events:auto; }
  .lb-card{
    width:100%; max-width:520px;
    transform:translateY(10px) scale(0.98);
    opacity:0;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;
  }
  #lightbox.open .lb-card{ transform:translateY(0) scale(1); opacity:1; }

  .lb-frame{
    background:var(--rebate);
    padding:0 6px;
  }
  .lb-window{
    position:relative;
    aspect-ratio:3/4;
    max-height:62vh;
    overflow:hidden;
    background:#000;
  }
  .lb-window img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:invert(0.92) hue-rotate(180deg) saturate(1.2) contrast(1.08) brightness(1.03);
    transition:filter 1.1s cubic-bezier(.3,.6,.3,1);
  }
  .lb-window .mask{
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(198,120,38,0.4), rgba(110,52,16,0.24));
    mix-blend-mode:multiply;
    pointer-events:none;
    transition:opacity 1.1s cubic-bezier(.3,.6,.3,1);
  }
  .lb-window.developed img{ filter:none; }
  .lb-window.developed .mask{ opacity:0; }

  .lb-caption{
    padding:16px 4px 6px;
    text-align:center;
  }
  .lb-caption .lb-eyebrow{
    font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--amber); margin:0 0 0.4rem;
  }
  .lb-caption .lb-title{
    font-family:'Newsreader', serif; font-style:italic; font-weight:500;
    font-size:1.15rem; color:var(--ink); margin:0 0 0.3rem;
  }
  .lb-caption .lb-note{
    font-size:11px; color:var(--ink-faint); line-height:1.6; margin:0;
  }

  #lb-close{
    position:absolute; top:20px; right:24px;
    background:none; border:none; color:var(--ink-soft);
    font-size:24px; line-height:1; cursor:pointer;
    z-index:2;
  }
  #lb-close:hover{ color:var(--ink); }

  @media(prefers-reduced-motion: reduce){
    .lb-window img, .lb-window .mask, .lb-card, #lightbox{ transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<nav id="top-pill-nav">
  <a href="../">&larr; wander ~ field notes</a>
  <span class="slash">/</span>
  <span class="current">On Film</span>
</nav>
<a href="https://contact.varunagarwal.com" id="contact-badge" aria-label="Contact">VA</a>

<div class="intro">
  <p class="eyebrow">wander / on the road</p>
  <h1>A strip of negatives.</h1>
  <p>Amsterdam, between the museums. Tap a frame to bring it up to the light — it develops into the full print.</p>
</div>

<div class="strip-stage">
  <div class="strip-scroll" id="stripScroll"></div>
  <p class="strip-hint" id="stripHint">drag to browse the roll &middot; tap a frame to develop it</p>
</div>

<div id="lightbox">
  <button id="lb-close" aria-label="Close">&times;</button>
  <div class="lb-card">
    <div class="lb-frame">
      <div class="sprockets"></div>
      <div class="lb-window" id="lbWindow">
        <img id="lbImg" src="" alt="">
        <div class="mask"></div>
      </div>
      <div class="sprockets"></div>
    </div>
    <div class="lb-caption">
      <p class="lb-eyebrow" id="lbEyebrow"></p>
      <p class="lb-title" id="lbTitle"></p>
      <p class="lb-note" id="lbNote"></p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Roll 1 — Amsterdam, the frames that weren't a museum wall:
   canals, harbor, streets, a park, the walk between museums.
   Museum pieces stay on the postcards page (../urotrip2026/);
   STRAAT's curated murals live on the street-art compendium
   page (../street-art/) — this roll is everything left over:
   candid, everyday, not gallery-hung anywhere else. ids 1-5 are
   the original set (moved here from postcards); 6-36 added
   2026-09-03 from the rest of the Aug 28-31 dump. Source images
   in europe/_review-tools/europe-2026-photo-db.json, legs
   amsterdam-canal/-street/-harbor/-evening.
   Berlin is going on the contact-sheet format instead (decided
   2026-09-03) — see ../urotrip2026/berlin/ — not another roll here.
   ============================================================ */
const FRAMES = [
  { id:1, img:'img/01-flower-car.jpg', title:'The Flower Car', location:'Museumplein, Amsterdam', note:'A hand-painted homage parked right outside the museum doors.' },
  { id:2, img:'img/02-through-the-window.jpg', title:'Through the Window', location:'En route, Amsterdam', note:'Shooting the city on the move, mirror and all.' },
  { id:3, img:'img/03-canal-ring.jpg', title:'Along the Grachtengordel', location:'Canal Ring, Amsterdam', note:'The 17th-century canal belt, houseboats and all, mid-stroll.' },
  { id:4, img:'img/04-guna-sticker.jpg', title:'Guna', location:'Street corner, Amsterdam', note:'A wheatpaste sticker stack on a lamppost, somewhere between the museums.' },
  { id:5, img:'img/05-dr-falafel.jpg', title:'Dr. Falafel', location:'Street corner, Amsterdam', note:'Shopfront signage, spotted on the walk over.' },
  { id:6, img:'img/06-canal-at-dusk.jpg', title:'Along the Canal', location:'Canal Ring, Amsterdam', note:'Petunias in the foreground, boats and bikes lining both sides.' },
  { id:8, img:'img/08-crane.jpg', title:'Crane', location:'Amsterdam', note:'A tower crane over an unfinished concrete frame.' },
  { id:9, img:'img/09-sticker-box.jpg', title:'Sticker Box', location:'Street corner, Amsterdam', note:'A utility cabinet gone thick with years of stickers.' },
  { id:10, img:'img/10-steeple-late.jpg', title:'Steeple', location:'Amsterdam', note:'A church spire over a street lined with parked cars, walking back after dark.' },
  { id:11, img:'img/11-glow.jpg', title:'Glow', location:'Amsterdam', note:'String lights woven through the trees along a quiet side street.' },
  { id:12, img:'img/12-the-house-cat.jpg', title:'The House Cat', location:'Amsterdam', note:'Presiding over the bar from a stool of its own — “the bar is yours,” the sign says.' },
  { id:13, img:'img/13-replica-at-anchor.jpg', title:'Glass and Steel', location:'Amsterdam harbor', note:'A glass-fronted building catching the grey sky, the letters “am” half-legible across it.' },
  { id:14, img:'img/14-nemo.jpg', title:'Muziekgebouw', location:'Amsterdam', note:'The concert hall on the IJ, Hannekes Boot\'s floating bar moored just below it.' },
  { id:15, img:'img/15-passing-through.jpg', title:'Passing Through', location:'Amsterdam harbor', note:'A dog on its own errand across the footbridge.' },
  { id:16, img:'img/16-gulls.jpg', title:'Gulls', location:'Amsterdam harbor', note:'Lined up on the railing, facing the wind.' },
  { id:17, img:'img/17-canal-ring-morning.jpg', title:'By the Water', location:'Amsterdam', note:'Sint-Nicolaaskerk across the water, a tour boat waiting for its next group.' },
  { id:19, img:'img/19-rowers.jpg', title:'Freewilly', location:'Amsterdam', note:'A flower-draped boat and its orange-suited crew, docked for the day.' },
  { id:20, img:'img/20-stencil.jpg', title:'On the Garage Door', location:'Street corner, Amsterdam', note:'A faded dance-school mural, half worn away.' },
  { id:21, img:'img/21-alley-cat.jpg', title:'Alley Cat', location:'Amsterdam', note:'Unbothered, mid-stride across the cobbles.' },
  { id:23, img:'img/23-parked.jpg', title:'Parked', location:'Amsterdam', note:'Handlebar to handlebar at a lock in the canal, a church dome behind them.' },
  { id:24, img:'img/24-under-the-bridge.jpg', title:'Under the Bridge', location:'Amsterdam', note:'One of the grand old bridges, crowned lampposts and all.' },
  { id:25, img:'img/25-rain-on-the-glass.jpg', title:'The Bridge Swings', location:'Amsterdam', note:'A lift bridge caught through the tour boat\'s window, a cyclist crossing as the light changes.' },
  { id:26, img:'img/26-grachtengordel.jpg', title:'Grachtengordel', location:'Amsterdam', note:'The canal running straight and calm between the houseboats.' },
  { id:27, img:'img/27-spotted.jpg', title:'Spotted', location:'Amsterdam', note:'A curly-coated regular out for a walk, a fresh tag on the block behind it.' },
  { id:28, img:'img/28-street-performer.jpg', title:'Street Performer', location:'Dam Square, Amsterdam', note:'Setting up a street act in front of Madame Tussauds.' },
  { id:29, img:'img/29-evening-canal.jpg', title:'Canal Houses', location:'Amsterdam', note:'A row of gabled facades, small boats moored below.' },
  { id:30, img:'img/30-wet-reflections.jpg', title:'Crossing', location:'Amsterdam', note:'Bike in hand, halfway across the bridge.' },
  { id:31, img:'img/31-tram.jpg', title:'Tram', location:'Amsterdam', note:'One of the city’s workhorses, caught mid-route.' },
  { id:32, img:'img/32-sky-over-the-park.jpg', title:'Sky Over the Park', location:'Vondelpark, Amsterdam', note:'A plane cutting through the clouds over the treeline.' },
  { id:33, img:'img/33-evening-walk.jpg', title:'Evening Walk', location:'Vondelpark, Amsterdam', note:'A last loop of the path before dark.' },
  { id:34, img:'img/34-goose.jpg', title:'Goose', location:'Vondelpark, Amsterdam', note:'Holding its ground on the path.' },
  { id:35, img:'img/35-feeding-the-ducks.jpg', title:'Feeding the Ducks', location:'Vondelpark, Amsterdam', note:'An outstretched hand, mid-negotiation.' },
  { id:36, img:'img/36-roses.jpg', title:'Roses', location:'Vondelpark, Amsterdam', note:'Still blooming red this late in the season.' },
];

/* ============================================================
   Render the strip
   ============================================================ */
const stripEl = document.getElementById('stripScroll');
FRAMES.forEach(f => {
  const num = String(f.id).padStart(2,'0');
  const el = document.createElement('figure');
  el.className = 'frame';
  el.dataset.id = f.id;
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', `Develop frame ${num}`);
  el.innerHTML = `
    <div class="sprockets"></div>
    <div class="edge-row"><span>LUCIDIT&Eacute; 6400</span><span class="num">${num}<span class="dot"> &middot;</span></span></div>
    <div class="frame-window"><img src="${f.img}" alt=""></div>
    <div class="sprockets"></div>
  `;
  stripEl.appendChild(el);
});

/* ============================================================
   Lightbox: open on a negative, "develop" into the positive
   ============================================================ */
const lightbox = document.getElementById('lightbox');
const lbWindow = document.getElementById('lbWindow');
const lbImg = document.getElementById('lbImg');
const lbEyebrow = document.getElementById('lbEyebrow');
const lbTitle = document.getElementById('lbTitle');
const lbNote = document.getElementById('lbNote');
let developTimer = null;
let currentFrameId = null;

function openFrame(id){
  const f = FRAMES.find(x => x.id === id);
  if(!f) return;
  currentFrameId = id;
  const num = String(f.id).padStart(2,'0');
  lbImg.src = f.img;
  lbEyebrow.textContent = `Frame ${num} · ${f.location || ''}`;
  lbTitle.textContent = f.title || 'Untitled';
  lbNote.textContent = f.note;
  lbWindow.classList.remove('developed');
  lightbox.classList.add('open');
  document.querySelector(`.frame[data-id="${id}"]`)?.classList.add('frame--seen');
  document.querySelector(`.frame[data-id="${id}"]`)?.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});

  clearTimeout(developTimer);
  developTimer = setTimeout(() => lbWindow.classList.add('developed'), 260);
}
function closeLightbox(){
  lightbox.classList.remove('open');
  clearTimeout(developTimer);
  currentFrameId = null;
}
function openAdjacentFrame(step){
  if(currentFrameId === null) return;
  const idx = FRAMES.findIndex(f => f.id === currentFrameId);
  if(idx === -1) return;
  const next = FRAMES[(idx + step + FRAMES.length) % FRAMES.length];
  openFrame(next.id);
}

stripEl.addEventListener('click', e => {
  const frame = e.target.closest('.frame');
  if(!frame) return;
  openFrame(+frame.dataset.id);
  document.getElementById('stripHint').style.opacity = 0;
});
stripEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const frame = e.target.closest('.frame');
  if(!frame) return;
  e.preventDefault();
  openFrame(+frame.dataset.id);
});
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  else if(e.key === 'ArrowRight'){ e.preventDefault(); openAdjacentFrame(1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); openAdjacentFrame(-1); }
});
</script>

</body>
</html>
