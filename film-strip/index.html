<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>On Film · Wander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0d0c0a;
    --rebate:#1c1a15;
    --rebate-2:#141210;
    --ink:#f2ece1;
    --ink-soft:rgba(242,236,225,0.72);
    --ink-faint:rgba(242,236,225,0.4);
    --amber:#e2a13a;
    --amber-deep:#a86a24;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    overflow-x:hidden;
  }
  a{ color:inherit; }

  /* ---------- nav (draft-page pattern, matches urotrip2026) ---------- */
  #top-pill-nav{
    position:fixed; top:20px; left:20px; z-index:20;
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 16px;
    background:rgba(28,26,21,0.7);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(242,236,225,0.1);
    border-radius:9999px;
    font-size:11px; letter-spacing:1px;
  }
  #top-pill-nav a{ text-decoration:none; color:var(--amber); text-transform:uppercase; font-weight:600; }
  #top-pill-nav a:hover{ color:#f0b559; }
  #top-pill-nav .slash{ color:#5a5650; }
  #top-pill-nav .current{ font-family:'Newsreader', serif; font-style:italic; color:var(--ink-faint); letter-spacing:0.3px; }

  #contact-badge{
    position:fixed; top:20px; right:20px; z-index:20;
    width:36px; height:36px;
    background:rgba(28,26,21,0.7);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(242,236,225,0.1);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; text-decoration:none;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  #contact-badge:hover{ transform:scale(1.08); border-color:rgba(242,236,225,0.3); }

  /* ---------- intro ---------- */
  .intro{
    max-width:520px; margin:0 auto;
    padding:96px 24px 8px;
    text-align:center;
  }
  .intro .eyebrow{
    font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--amber); margin:0 0 0.7rem;
  }
  .intro h1{
    font-family:'Newsreader', serif; font-weight:500; font-style:italic;
    font-size:clamp(1.7rem, 5vw, 2.3rem); line-height:1.15;
    margin:0 0 0.7rem; color:var(--ink);
  }
  .intro p{
    font-size:12px; line-height:1.7; color:var(--ink-soft); margin:0;
  }

  /* ---------- the strip ---------- */
  .strip-stage{
    position:relative;
    padding:48px 0 40px;
  }
  .strip-scroll{
    display:flex; align-items:stretch;
    gap:0;
    overflow-x:auto; overflow-y:hidden;
    padding:0 max(24px, calc(50vw - 110px)) 12px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
  }
  .strip-scroll::-webkit-scrollbar{ display:none; }
  .strip-scroll{ scrollbar-width:none; }

  .frame{
    flex:0 0 auto;
    width:184px;
    scroll-snap-align:center;
    background:var(--rebate);
    border-left:1px solid var(--rebate-2);
    padding:0 3px;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .frame:first-child{ border-left:none; }
  .frame:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

  .sprockets{
    height:14px;
    background-image:radial-gradient(circle at 7px 7px, var(--paper) 3.1px, transparent 3.2px);
    background-size:16px 14px;
    background-repeat:repeat-x;
    background-position:4px 0;
  }

  .edge-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:3px 8px 4px;
    font-size:8px; letter-spacing:0.6px;
    color:var(--amber-deep);
    transition:color 0.4s ease;
  }
  .frame--seen .edge-row{ color:var(--ink-faint); }
  .edge-row .num{ font-weight:700; }
  .edge-row .dot{ opacity:0; transition:opacity 0.3s ease; }
  .frame--seen .edge-row .dot{ opacity:1; }

  .frame-window{
    position:relative;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#000;
  }
  .frame-window img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:invert(0.92) hue-rotate(180deg) saturate(1.2) contrast(1.08) brightness(1.03);
  }
  .frame-window::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(198,120,38,0.4), rgba(110,52,16,0.24));
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .frame-window::before{
    content:"";
    position:absolute; inset:0; z-index:2;
    box-shadow:inset 0 0 0 1px rgba(242,236,225,0.06);
    pointer-events:none;
  }

  .strip-hint{
    text-align:center;
    font-size:10px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:4px;
    transition:opacity 0.6s ease;
  }

  /* ---------- lightbox: the loupe / developing tray ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(6,5,4,0.94);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transition:opacity 0.3s ease;
  }
  #lightbox.open{ opacity:1; pointer-events:auto; }
  .lb-card{
    width:100%; max-width:520px;
    transform:translateY(10px) scale(0.98);
    opacity:0;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;
  }
  #lightbox.open .lb-card{ transform:translateY(0) scale(1); opacity:1; }

  .lb-frame{
    background:var(--rebate);
    padding:0 6px;
  }
  .lb-window{
    position:relative;
    aspect-ratio:3/4;
    max-height:62vh;
    overflow:hidden;
    background:#000;
  }
  .lb-window img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:invert(0.92) hue-rotate(180deg) saturate(1.2) contrast(1.08) brightness(1.03);
    transition:filter 1.1s cubic-bezier(.3,.6,.3,1);
  }
  .lb-window .mask{
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(198,120,38,0.4), rgba(110,52,16,0.24));
    mix-blend-mode:multiply;
    pointer-events:none;
    transition:opacity 1.1s cubic-bezier(.3,.6,.3,1);
  }
  .lb-window.developed img{ filter:none; }
  .lb-window.developed .mask{ opacity:0; }

  .lb-caption{
    padding:16px 4px 6px;
    text-align:center;
  }
  .lb-caption .lb-eyebrow{
    font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--amber); margin:0 0 0.4rem;
  }
  .lb-caption .lb-title{
    font-family:'Newsreader', serif; font-style:italic; font-weight:500;
    font-size:1.15rem; color:var(--ink); margin:0 0 0.3rem;
  }
  .lb-caption .lb-note{
    font-size:11px; color:var(--ink-faint); line-height:1.6; margin:0;
  }

  #lb-close{
    position:absolute; top:20px; right:24px;
    background:none; border:none; color:var(--ink-soft);
    font-size:24px; line-height:1; cursor:pointer;
    z-index:2;
  }
  #lb-close:hover{ color:var(--ink); }

  @media(prefers-reduced-motion: reduce){
    .lb-window img, .lb-window .mask, .lb-card, #lightbox{ transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<nav id="top-pill-nav">
  <a href="../">&larr; wander ~ field notes</a>
  <span class="slash">/</span>
  <span class="current">On Film</span>
</nav>
<a href="https://contact.varunagarwal.com" id="contact-badge" aria-label="Contact">VA</a>

<div class="intro">
  <p class="eyebrow">wander / draft treatment</p>
  <h1>A strip of negatives.</h1>
  <p>Tap one to bring it up to the light — it develops into the full print. Placeholder frames for now, until a real roll gets scanned in.</p>
</div>

<div class="strip-stage">
  <div class="strip-scroll" id="stripScroll"></div>
  <p class="strip-hint" id="stripHint">drag to browse the roll &middot; tap a frame to develop it</p>
</div>

<div id="lightbox">
  <button id="lb-close" aria-label="Close">&times;</button>
  <div class="lb-card">
    <div class="lb-frame">
      <div class="sprockets"></div>
      <div class="lb-window" id="lbWindow">
        <img id="lbImg" src="" alt="">
        <div class="mask"></div>
      </div>
      <div class="sprockets"></div>
    </div>
    <div class="lb-caption">
      <p class="lb-eyebrow" id="lbEyebrow"></p>
      <p class="lb-title" id="lbTitle"></p>
      <p class="lb-note" id="lbNote"></p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Placeholder frame art — abstract washes, not real photos.
   Swap FRAMES for a real DATA array (per STANDARDS.md's schema:
   id, img, location, notes, altText, date, order, colorFrame)
   once a roll is scanned in, and this same negative/positive
   mechanism carries over unchanged.
   ============================================================ */
const WASHES = ['#8a4a2c','#3d5a4a','#6b4f8a','#2f5266','#8a6a2a','#5a2f3d','#3a6b52'];

function frameArt(seed){
  const base = WASHES[seed % WASHES.length];
  const blobs = [];
  for(let i=0;i<4;i++){
    const cx = ((seed*37 + i*53) % 100);
    const cy = ((seed*67 + i*29) % 100);
    const r = 18 + ((seed*13 + i*11) % 22);
    blobs.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#000" opacity="${0.12 + (i%3)*0.06}"/>`);
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='240' height='320'>` +
    `<rect width='100%' height='100%' fill='${base}'/>` +
    blobs.map(b => `<g transform="scale(2.4,3.2)">${b}</g>`).join('') +
    `</svg>`;
  return `data:image/svg+xml;base64,${btoa(svg)}`;
}

const FRAMES = Array.from({length:12}, (_, i) => ({
  id:i+1,
  img:frameArt(i),
  note:'awaiting a real roll'
}));

/* ============================================================
   Render the strip
   ============================================================ */
const stripEl = document.getElementById('stripScroll');
FRAMES.forEach(f => {
  const num = String(f.id).padStart(2,'0');
  const el = document.createElement('figure');
  el.className = 'frame';
  el.dataset.id = f.id;
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', `Develop frame ${num}`);
  el.innerHTML = `
    <div class="sprockets"></div>
    <div class="edge-row"><span>LUCIDIT&Eacute; 6400</span><span class="num">${num}<span class="dot"> &middot;</span></span></div>
    <div class="frame-window"><img src="${f.img}" alt=""></div>
    <div class="sprockets"></div>
  `;
  stripEl.appendChild(el);
});

/* ============================================================
   Lightbox: open on a negative, "develop" into the positive
   ============================================================ */
const lightbox = document.getElementById('lightbox');
const lbWindow = document.getElementById('lbWindow');
const lbImg = document.getElementById('lbImg');
const lbEyebrow = document.getElementById('lbEyebrow');
const lbTitle = document.getElementById('lbTitle');
const lbNote = document.getElementById('lbNote');
let developTimer = null;

function openFrame(id){
  const f = FRAMES.find(x => x.id === id);
  if(!f) return;
  const num = String(f.id).padStart(2,'0');
  lbImg.src = f.img;
  lbEyebrow.textContent = `Frame ${num}`;
  lbTitle.textContent = 'Untitled';
  lbNote.textContent = f.note;
  lbWindow.classList.remove('developed');
  lightbox.classList.add('open');
  document.querySelector(`.frame[data-id="${id}"]`)?.classList.add('frame--seen');

  clearTimeout(developTimer);
  developTimer = setTimeout(() => lbWindow.classList.add('developed'), 260);
}
function closeLightbox(){
  lightbox.classList.remove('open');
  clearTimeout(developTimer);
}

stripEl.addEventListener('click', e => {
  const frame = e.target.closest('.frame');
  if(!frame) return;
  openFrame(+frame.dataset.id);
  document.getElementById('stripHint').style.opacity = 0;
});
stripEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const frame = e.target.closest('.frame');
  if(!frame) return;
  e.preventDefault();
  openFrame(+frame.dataset.id);
});
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
