<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CONCERTS — Field Notes</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#110B0A;
    --card:#1D1512;
    --ink:#F1E7D6;
    --red:#E12A2F;
    --red-dark:#7A0F14;
    --yellow:#E0B23C;
    --grey:#A8988A;
    --line: rgba(241,231,214,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  img{ -webkit-touch-callout: none; }
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:999;
    opacity:.05; mix-blend-mode:overlay;
    background-image:radial-gradient(var(--ink) 0.6px, transparent 0.6px);
    background-size:3px 3px;
  }

  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, var(--paper) 75%, transparent);
    padding:16px 18px 10px;
    border-bottom:1px solid var(--line);
    backdrop-filter: blur(6px);
    transition:padding .3s ease;
  }
  .header-mark{
    position:absolute; top:14px; right:18px; z-index:2;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--paper);
    font-family:'Anton', sans-serif; font-size:16px;
    color:var(--paper); background:var(--yellow);
    transform:rotate(8deg);
  }
  .header-inner{position:relative; padding-right:60px;}
  .eyebrow{
    font-size:11px; letter-spacing:0.2em; color:var(--grey);
    text-transform:uppercase; margin-bottom:8px;
  }
  .eyebrow a{color:var(--grey); text-decoration:none; border-bottom:1px dotted var(--grey);}
  .eyebrow a:hover{color:var(--red); border-color:var(--red);}
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(30px, 7vw, 44px);
    letter-spacing:0.01em;
    margin:0;
    line-height:0.88;
    color:var(--ink);
    text-transform:uppercase;
  }
  h1 span{color:var(--red);}
  .sub{
    color:var(--grey); font-size:12.5px; margin-top:8px; max-width:60ch; line-height:1.5;
  }
  @media(min-width:860px){
    .header-inner{ display:flex; align-items:center; justify-content:space-between; gap:40px; padding-top:10px; }
    .sub{ margin-top:0; max-width:320px; text-align:right; }
  }

  .filters{
    display:flex; gap:8px; overflow-x:auto; padding:14px 0 4px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'Space Mono', monospace;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    padding:7px 13px;
    border:2px dashed var(--ink);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--ink); color:var(--paper); border-style:solid; }
  .count{font-size:11px; color:var(--grey); padding:6px 0 2px;}
  .count b{color:var(--ink);}

  main{padding:6px 14px 80px; max-width:1150px; margin:0 auto;}
  .wall{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:26px;
    padding-top:18px;
  }

  .card{
    opacity:0; transform:translateY(16px) rotate(var(--r,0deg));
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease;
    cursor:pointer;
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow: 3px 5px 0 rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.35);
  }
  .card.in{opacity:1; transform:translateY(0) rotate(var(--r,0deg));}
  .card:nth-child(3n+1){--r:-1.4deg;}
  .card:nth-child(3n+2){--r:0.8deg;}
  .card:nth-child(3n+3){--r:-0.4deg;}
  @media(hover:hover){
    .card:hover{ transform:rotate(0deg) translateY(-4px); box-shadow:4px 8px 0 rgba(0,0,0,0.45), 0 16px 26px rgba(0,0,0,0.5); z-index:2; }
  }

  .tape{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:54px; height:18px; background:rgba(224,178,60,0.55);
    border:1px solid rgba(0,0,0,0.08);
  }

  .poster{
    position:relative; height:150px; color:var(--ink);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:radial-gradient(var(--ink) 1.1px, transparent 1.1px) 0 0/7px 7px, var(--red-dark);
  }
  .card:nth-child(even) .poster{
    background:radial-gradient(var(--ink) 1.1px, transparent 1.1px) 0 0/7px 7px, var(--card);
  }
  .poster svg{ width:60px; height:60px; }
  .poster.has-photo{ background:var(--card); }
  .poster.has-photo img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  .video-badge{
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.55); color:var(--ink);
    font-size:9px; letter-spacing:0.08em; padding:3px 7px; border-radius:3px;
  }
  .badge{
    position:absolute; top:8px; left:8px; z-index:2;
    font-family:'Anton', sans-serif; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    border:1.5px solid var(--ink); padding:3px 7px; transform:rotate(-4deg); color:var(--ink);
  }

  .title-bar{ background:var(--paper); color:var(--ink); padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  .title-bar h3{ font-family:'Anton', sans-serif; font-weight:400; font-size:21px; line-height:1; margin:0; }
  .meta-line{ padding:10px 12px 0; font-size:11.5px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; }

  .perf{ position:relative; margin:12px 0 0; border-top:2px dashed rgba(0,0,0,0.28); }
  .perf::before, .perf::after{ content:""; position:absolute; top:-8px; width:16px; height:16px; background:var(--paper); border-radius:50%; }
  .perf::before{ left:-9px; } .perf::after{ right:-9px; }
  .stub{ display:flex; justify-content:space-between; align-items:flex-end; gap:8px; padding:10px 12px 14px; }
  .stub .date{ font-size:12px; font-weight:700; color:var(--red); white-space:nowrap; }

  .empty{ text-align:center; padding:60px 20px; color:var(--grey); font-size:12px; }

  /* drawer */
  .scrim{ position:fixed; inset:0; background:rgba(15,12,9,0.6); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:100; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:101;
    background:var(--card); border-top:2px solid var(--ink);
    padding:22px 20px 28px; transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-height:78vh; overflow-y:auto;
  }
  .drawer.open{ transform:translateY(0); }
  .drawer-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px; }
  .drawer-close{
    position:absolute; top:16px; right:16px; background:var(--paper);
    border:1.5px solid var(--ink); color:var(--ink);
    width:30px; height:30px; border-radius:100px; font-size:14px; cursor:pointer;
  }
  .d-media{ margin-bottom:10px; border-radius:4px; overflow:hidden; background:var(--card); }
  .d-media img, .d-media video{ width:100%; display:block; max-height:52vh; object-fit:cover; }
  .d-extras{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; scrollbar-width:none; }
  .d-extras::-webkit-scrollbar{ display:none; }
  .d-extras img{
    width:68px; height:68px; flex:0 0 auto; object-fit:cover; border-radius:4px;
    cursor:pointer; opacity:0.7; border:2px solid transparent; transition:opacity .15s ease, border-color .15s ease;
  }
  .d-extras img.active{ opacity:1; border-color:var(--red); }
  .d-extras img:hover{ opacity:1; }
  .d-loc{ font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--grey); display:flex; justify-content:space-between; }
  .d-title{ font-family:'Anton',sans-serif; font-size:28px; text-transform:uppercase; margin:6px 0 12px; line-height:1; }
  .d-notes{ font-size:13.5px; line-height:1.65; color:var(--ink); white-space:pre-line; }
  .d-notes.notes-empty{ color:var(--grey); font-style:italic; }
  .d-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .d-tags .tag{ font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--line); border-radius:3px; color:var(--grey); }

  footer{ text-align:center; padding:30px 16px 60px; color:var(--grey); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; }
  footer a{ color:var(--red); text-decoration:none; }
</style>
</head>
<body>

<header id="siteHeader">
  <span class="header-mark">VA</span>
  <div class="header-inner">
    <div class="title-block">
      <div class="eyebrow"><a href="../">← field notes</a> / concerts</div>
      <h1>CON<span>CERTS</span></h1>
    </div>
    <div class="sub">Every gig I've stood in a crowd for — logged, stubbed, kept. Tap a card to fill in details.</div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
</header>

<main>
  <div class="wall" id="wall"></div>
  <div class="empty" id="empty" style="display:none;">Nothing filed for this year yet.</div>
</main>

<footer>Concerts · logged as I go</footer>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <button class="drawer-close" id="drawerClose">✕</button>
  <div class="d-media" id="dMedia"></div>
  <div class="d-extras" id="dExtras"></div>
  <div class="d-loc" id="dLoc"></div>
  <div class="d-title" id="dTitle"></div>
  <div class="d-notes" id="dNotes"></div>
  <div class="d-tags" id="dTags"></div>
</div>

<script>
/* ============================================================
   DATA — one object per show. Edit this array directly to add,
   fix, or fill in gigs; the page re-renders from it.

   artist    — display name
   img       — path to a photo in img/ (or a poster frame for a video),
               or null for the poster-icon placeholder
   type      — 'photo' (default) or 'video'
   video     — path to a video file in img/, only used when type is 'video'
               (plays in the drawer; img above is used as its poster frame)
   extras    — optional array of extra photo paths in img/. Shown as a
               side-scrolling thumbnail strip in the drawer — tap one to
               view it in the main media area. Leave out or [] if none.
   venue,city— plain text, leave "" until known
   date      — 'YYYY-MM-DD', or "" if unknown (shows under the TBC tab)
   billing   — free text, e.g. 'Headline', 'Support', 'Festival', 'DJ set'
               — leave "" until you know it, nothing breaks
   notes     — your words only, shown in the drawer
   tags      — short labels, freely organised
   order     — lowest first when dates tie; otherwise sort is by date
   ============================================================ */
const DATA = [
  {id:1, artist:'A Murder of Crows', img:'img/banshee-labyrinth.jpg', type:'photo', video:null, extras:['img/banshee-labyrinth-2.jpg','img/banshee-labyrinth-3.jpg'], venue:'The Banshee Labyrinth', city:'Edinburgh, Scotland', date:'2025-10-31', billing:'', notes:'Halloween show at The Banshee Labyrinth — self-billed as the most haunted nightclub in the world.', tags:['halloween show'], order:1},
  {id:2, artist:'Green Day', img:'img/green-day.jpg', type:'photo', video:null, extras:['img/green-day-2.jpg','img/green-day-3.jpg','img/green-day-4.jpg'], venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-09', billing:'Headline', notes:'Lollapalooza India — headline set.', tags:['punk rock','festival'], order:2},
  {id:3, artist:'Hanumankind', img:'img/hanumankind.jpg', type:'photo', video:null, venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-09', billing:'Festival', notes:'Lollapalooza India.', tags:['hip-hop','festival'], order:3},
  {id:4, artist:'Nothing But Thieves', img:'img/nothing-but-thieves.jpg', type:'photo', video:null, venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-09', billing:'Festival', notes:'Lollapalooza India — spotted their name on the big screen mid-set.', tags:['rock','festival'], order:4},
  {id:5, artist:'Glass Beams', img:'img/glass-beams.jpg', type:'photo', video:null, extras:['img/glass-beams-2.jpg','img/glass-beams-3.jpg'], venue:'', city:'Bangalore, India', date:'2025-10-12', billing:'', notes:'Bangalore show.', tags:['instrumental'], order:5},
  {id:6, artist:'John Mayer', img:'img/john-mayer.jpg', type:'photo', video:null, venue:'', city:'Mumbai, India', date:'2026-02-11', billing:'', notes:'Mumbai show.', tags:['pop rock'], order:6},
  {id:7, artist:'Jonita Gandhi', img:'img/jonita-gandhi.jpg', type:'photo', video:null, venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-08', billing:'Festival', notes:'Lollapalooza India — day one, Corona Sunsets stage.', tags:['pop','festival'], order:7},
  {id:8, artist:'Ben Howard', img:'img/ben-howard.jpg', type:'photo', video:null, extras:['img/ben-howard-2.jpg'], venue:'', city:'Mumbai, India', date:'2024-05-17', billing:'', notes:'Mumbai show.', tags:['folk'], order:8},
  {id:9, artist:'Isabel LaRosa', img:'img/isabel-larosa.jpg', type:'photo', video:null, extras:['img/isabel-larosa-2.jpg','img/isabel-larosa-3.jpg'], venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-08', billing:'Festival', notes:'Lollapalooza India — day one.', tags:['pop','festival'], order:9},
  {id:10, artist:'AURORA', img:'img/aurora.jpg', type:'photo', video:null, venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-09', billing:'Festival', notes:'Lollapalooza India — day two.', tags:['pop','festival'], order:10},
  {id:11, artist:'Talwiinder', img:'img/talwinder.jpg', type:'photo', video:null, extras:['img/talwinder-2.jpg','img/talwinder-3.jpg'], venue:'Mahalaxmi Race Course', city:'Mumbai, India', date:'2025-03-08', billing:'Festival', notes:'Lollapalooza India — day one.', tags:['hip-hop','festival'], order:11},
  {id:12, artist:'Amit Trivedi', img:'img/amit-trivedi.jpg', type:'video', video:'img/amit-trivedi.mp4', venue:'', city:'', date:'2025-05-04', billing:'', notes:'', tags:[], order:12},
  {id:13, artist:'Prateek Kuhad', img:'img/prateek-kuhad.jpg', type:'photo', video:null, venue:'', city:'', date:'2023-02-11', billing:'', notes:'', tags:[], order:13},
  {id:15, artist:'Lucky Ali', img:'img/lucky-ali.jpg', type:'video', video:'img/lucky-ali.mp4', venue:'', city:'', date:'2022-09-25', billing:'', notes:'Casa Bacardí stage — rained out but he played through it, half the crowd under umbrellas.', tags:['festival'], order:15},
  {id:16, artist:'Katy Perry', img:'img/katy-perry.jpg', type:'photo', video:null, venue:'', city:'London, England', date:'2018-06-14', billing:'', notes:'', tags:['pop'], order:16},
  {id:17, artist:'A Perfect Circle', img:'img/a-perfect-circle.jpg', type:'photo', video:null, venue:'O2 Academy Brixton', city:'London, England', date:'2018-06-13', billing:'Sold Out', notes:'', tags:['rock'], order:17},
];

const ICONS = [
  `<svg viewBox="0 0 100 100" fill="var(--ink)"><rect x="38" y="8" width="24" height="42" rx="12"/><rect x="46" y="50" width="8" height="18"/><path d="M30 44a20 20 0 0 0 40 0" stroke="var(--ink)" stroke-width="6" fill="none"/><line x1="50" y1="70" x2="50" y2="84" stroke="var(--ink)" stroke-width="6"/><line x1="34" y1="84" x2="66" y2="84" stroke="var(--ink)" stroke-width="6"/></svg>`,
  `<svg viewBox="0 0 100 100" fill="var(--ink)"><ellipse cx="36" cy="66" rx="24" ry="27"/><ellipse cx="36" cy="66" rx="8" ry="9" fill="var(--red-dark)"/><rect x="46" y="8" width="10" height="55" rx="3"/><rect x="43" y="4" width="16" height="10" rx="2"/></svg>`,
  `<svg viewBox="0 0 100 100" fill="var(--ink)"><rect x="20" y="12" width="60" height="76" rx="6"/><circle cx="50" cy="36" r="15" fill="var(--red-dark)"/><circle cx="50" cy="70" r="10" fill="var(--red-dark)"/></svg>`
];

let activeYear = 'ALL';

function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}

function yearsFrom(list){
  const ys = new Set(list.map(s => (s.date || '').slice(0,4)).filter(Boolean));
  return Array.from(ys).sort().reverse();
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  const years = yearsFrom(DATA);
  const hasUndated = DATA.some(s => !s.date);
  const chips = [{id:'ALL', label:'All'}, ...years.map(y => ({id:y, label:y})), ...(hasUndated ? [{id:'TBC', label:'TBC'}] : [])];
  wrap.innerHTML = chips.map(c => `<button class="chip ${activeYear===c.id?'active':''}" data-y="${c.id}">${c.label}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(el => {
    el.onclick = () => { activeYear = el.dataset.y; renderFilters(); renderWall(); };
  });
}

function renderWall(){
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  const items = DATA
    .filter(s => activeYear === 'ALL' || (activeYear === 'TBC' ? !s.date : (s.date || '').slice(0,4) === activeYear))
    .sort((a,b) => {
      if(!a.date && !b.date) return (a.order ?? 0) - (b.order ?? 0);
      if(!a.date) return 1;
      if(!b.date) return -1;
      return b.date.localeCompare(a.date);
    });

  count.innerHTML = `<b>${items.length}</b> show${items.length===1?'':'s'}`;

  if(items.length === 0){ wall.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  wall.innerHTML = items.map((s, i) => {
    const icon = ICONS[i % ICONS.length];
    const metaBits = [s.venue, s.city].filter(Boolean).join(' · ') || 'details tbc — tap to add';
    return `
    <div class="card" data-id="${s.id}">
      <div class="tape"></div>
      <div class="poster ${s.img ? 'has-photo' : ''}">
        ${s.billing ? `<div class="badge">${esc(s.billing)}</div>` : ''}
        ${s.type === 'video' ? '<div class="video-badge">▶ VIDEO</div>' : ''}
        ${s.img ? `<img src="${s.img}" alt="${esc(s.artist)}" loading="lazy">` : icon}
      </div>
      <div class="title-bar"><h3>${esc(s.artist)}</h3></div>
      <div class="meta-line">${esc(metaBits)}</div>
      <div class="perf"></div>
      <div class="stub">
        <div class="date">${s.date ? fmtDate(s.date) : 'DATE TBC'}</div>
      </div>
    </div>`;
  }).join('');

  wall.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDrawer(parseInt(el.dataset.id));
    requestAnimationFrame(() => el.classList.add('in'));
  });
}

function showMedia(s, src){
  const mediaEl = document.getElementById('dMedia');
  if(src){
    mediaEl.innerHTML = `<img src="${src}" alt="${esc(s.artist)}">`;
  } else if(s.type === 'video' && s.video){
    mediaEl.innerHTML = `<video src="${s.video}" ${s.img ? `poster="${s.img}"` : ''} controls playsinline></video>`;
  } else if(s.img){
    mediaEl.innerHTML = `<img src="${s.img}" alt="${esc(s.artist)}">`;
  } else {
    mediaEl.innerHTML = '';
  }
}

function openDrawer(id){
  const s = DATA.find(d => d.id === id);
  if(!s) return;
  showMedia(s, null);

  const extrasEl = document.getElementById('dExtras');
  const extras = s.extras || [];
  if(extras.length){
    extrasEl.style.display = 'flex';
    // include the cover photo itself as the first thumbnail (highlighted,
    // since it's what's showing by default) so it's never orphaned once
    // you've tapped over to one of the extras — for video shows, leave it
    // out so tapping around doesn't swap the playable video for a still.
    const allSrcs = s.type === 'video' ? extras : [s.img, ...extras];
    extrasEl.innerHTML = allSrcs.map((src, i) => `<img src="${src}" alt="${esc(s.artist)} — photo ${i+1}" data-src="${src}" class="${i===0 && s.type!=='video' ? 'active' : ''}">`).join('');
    extrasEl.querySelectorAll('img').forEach(thumb => {
      thumb.onclick = () => {
        showMedia(s, thumb.dataset.src);
        extrasEl.querySelectorAll('img').forEach(t => t.classList.toggle('active', t === thumb));
      };
    });
  } else {
    extrasEl.style.display = 'none';
    extrasEl.innerHTML = '';
  }

  document.getElementById('dLoc').innerHTML = `<span>${[s.venue, s.city].filter(Boolean).join(', ') || 'venue / city tbc'}</span><span>${s.date ? fmtDate(s.date) : 'date tbc'}</span>`;
  document.getElementById('dTitle').textContent = s.artist;
  const notesEl = document.getElementById('dNotes');
  if(s.notes && s.notes.trim()){
    notesEl.textContent = s.notes; notesEl.classList.remove('notes-empty');
  }else{
    notesEl.textContent = '— add your notes —'; notesEl.classList.add('notes-empty');
  }
  document.getElementById('dTags').innerHTML = [
    s.billing ? `<span class="tag">${esc(s.billing)}</span>` : '',
    ...s.tags.map(t => `<span class="tag">${esc(t)}</span>`)
  ].join('');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('scrim').onclick = closeDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;

renderFilters();
renderWall();

document.addEventListener('contextmenu', (e) => { if(e.target.closest('.poster')) e.preventDefault(); });
document.addEventListener('dragstart', (e) => { if(e.target.closest('.poster')) e.preventDefault(); });
</script>

</body>
