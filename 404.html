<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Wander</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3ECDE">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F3ECDE; --blue:#2A46E0; --coral:#FF6B4A; --ink:#17140C; --ink-soft:rgba(23,20,12,0.62); --card:#FFFFFF; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--cream); color:var(--ink);
    font-family:"Inter", system-ui, sans-serif;
    min-height:100vh; display:grid; place-items:center; padding:2rem 1rem;
  }
  .card{
    background:var(--card); border-radius:18px; padding:2.25rem 1.75rem 2rem;
    max-width:420px; width:100%;
    box-shadow:0 1px 0 rgba(23,20,12,0.06), 0 12px 30px -12px rgba(23,20,12,0.25);
    position:relative;
  }
  .stamp{
    position:absolute; top:1.1rem; right:1.1rem;
    font-family:"Fredoka", sans-serif; font-weight:600; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--coral); border:2px solid var(--coral); border-radius:6px; padding:0.2rem 0.5rem;
    transform:rotate(8deg);
  }
  h1{ font-family:"Fredoka", sans-serif; font-weight:700; font-size:4.5rem; line-height:1; margin:0 0 0.75rem; color:var(--blue); }
  p{ margin:0 0 1.75rem; line-height:1.6; color:var(--ink-soft); }
  nav{ display:flex; flex-wrap:wrap; gap:0.6rem; }
  nav a{
    font-family:"Fredoka", sans-serif; font-weight:600; font-size:0.95rem;
    text-decoration:none; border-radius:999px; padding:0.55rem 1.1rem;
    background:var(--blue); color:#fff;
  }
  nav a.alt{ background:transparent; color:var(--blue); box-shadow:inset 0 0 0 2px var(--blue); }
  nav a:hover{ background:var(--coral); color:#fff; box-shadow:none; }
</style>
</head>
<body>
<div class="card">
  <span class="stamp">Return to sender</span>
  <h1>404</h1>
  <p>There's no page at this address.</p>
  <nav>
    <a href="https://wander.varunagarwal.com/">Wander</a>
    <a class="alt" id="search-link" href="https://blog.varunagarwal.com/" hidden></a>
  </nav>
</div>
<script>
  // turn the missing path into a search on the hub, e.g. /prauge → "prauge"
  const seg = decodeURIComponent(location.pathname).split('/').filter(Boolean).pop() || '';
  const term = seg.replace(/\.html?$/, '').replace(/[-_+]+/g, ' ').trim();
  if (term) {
    const a = document.getElementById('search-link');
    a.href = 'https://blog.varunagarwal.com/?q=' + encodeURIComponent(term);
    a.textContent = 'Search for “' + term + '”';
    a.hidden = false;
  }
</script>
</body>
</html>
