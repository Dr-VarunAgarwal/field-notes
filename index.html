<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Field Notes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE3CC;
    --card:#F6F0DF;
    --navy:#1B2A4A;
    --navy-deep:#0F1826;
    --brass:#A9791F;
    --oxblood:#7A2E2A;
    --line: rgba(27,42,74,0.16);
    --ink-soft: rgba(27,42,74,0.62);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(27,42,74,0.05), transparent 45%),
      var(--paper);
    color:var(--navy);
    font-family:'Courier Prime', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:999;
    opacity:.05; mix-blend-mode:multiply;
    background-image:radial-gradient(var(--navy) 0.6px, transparent 0.6px);
    background-size:3px 3px;
  }

  header{
    padding:26px 18px 22px;
    border-bottom:2px solid var(--navy);
    position:relative;
  }
  .header-mark{
    position:absolute; top:24px; right:18px;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--navy);
    background:var(--card);
    font-family:'Fraunces', serif; font-weight:600; font-size:16px;
    color:var(--navy);
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.22em; color:var(--ink-soft);
    text-transform:uppercase; margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(40px, 9vw, 66px);
    letter-spacing:-0.01em;
    margin:0;
    line-height:0.94;
    color:var(--navy);
    padding-right:60px;
  }
  h1 em{ font-style:italic; font-weight:500; color:var(--brass); }
  .intro{
    color:var(--ink-soft); font-size:13.5px; line-height:1.7; font-style:italic;
    max-width:54ch; margin-top:16px; padding-right:60px; font-family:'Fraunces', serif;
  }

  main{padding:34px 14px 80px; max-width:1150px; margin:0 auto;}
  .wall{
    display:grid;
    grid-template-columns:1fr;
    gap:28px;
  }
  @media(min-width:640px){
    .wall{ grid-template-columns:1fr 1fr; }
  }
  @media(min-width:980px){
    .wall{ grid-template-columns:1fr 1fr 1fr; }
  }

  .card{
    opacity:0; transform:translateY(18px) rotate(var(--r,0deg));
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease;
  }
  .card.in{opacity:1; transform:translateY(0) rotate(var(--r,0deg));}
  .card:nth-child(3n+1){--r:-0.35deg;}
  .card:nth-child(3n+2){--r:0.3deg;}
  .card:nth-child(3n+3){--r:-0.15deg;}

  .card.is-live{cursor:pointer;}
  @media(min-width:640px){
    .card.is-live:hover{ z-index:5; transform:translateY(-4px) rotate(0deg); }
    .card.is-live:hover .frame{ box-shadow:5px 7px 0 var(--navy), 0 16px 26px -14px rgba(15,24,38,0.5); }
  }

  .frame{
    position:relative;
    background:var(--card);
    border:1px solid var(--navy);
    box-shadow:3px 4px 0 rgba(27,42,74,0.5);
    transition:box-shadow .2s ease;
  }
  .frame::before{
    content:""; position:absolute; top:14px; left:14px;
    width:9px; height:9px; border-radius:50%;
    background:var(--paper); border:1.5px solid var(--navy);
    z-index:2;
  }
  .card.is-draft .frame{ opacity:0.72; }

  .tab{
    position:absolute; top:-13px; left:32px;
    background:var(--navy); color:var(--paper);
    font-family:'Courier Prime', monospace; font-size:10px; letter-spacing:0.08em;
    padding:3px 9px; z-index:2;
  }

  .thumb{
    width:100%; aspect-ratio:4/3;
    background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    margin-top:8px;
  }
  .thumb.has-cover{
    background-size:cover; background-position:center;
  }
  .thumb .glyph{font-size:26px; opacity:0.35; color:var(--navy); font-family:'Fraunces', serif; font-style:italic;}
  .corner{
    position:absolute; width:16px; height:16px; z-index:2;
    border-style:solid; border-color:var(--card); pointer-events:none;
  }
  .corner.tl{ top:6px; left:6px; border-width:2px 0 0 2px; }
  .corner.br{ bottom:6px; right:6px; border-width:0 2px 2px 0; }

  .status-badge{
    position:absolute; bottom:8px; right:8px; z-index:2;
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:10.5px; letter-spacing:0.03em;
    padding:4px 10px; border-radius:100px;
    transform:rotate(-3deg);
  }
  .status-badge.live{ background:var(--card); color:var(--brass); border:1.5px solid var(--brass); }
  .status-badge.draft{ background:var(--card); color:var(--oxblood); border:1.5px solid var(--oxblood); }

  .meta{padding:14px 16px 18px;}
  .meta .place-name{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:23px; letter-spacing:-0.005em; line-height:1.05;
  }
  .meta .rule{
    border:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    height:3px; margin:9px 0 10px;
  }
  .meta .blurb{
    color:var(--ink-soft); font-size:12px; line-height:1.6;
  }
  .meta .blurb.tbd{ font-style:italic; }
  .meta .count{
    font-size:10px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--navy); margin-top:10px; display:block; font-weight:700;
  }

  footer{
    text-align:center; padding:34px 16px 60px; color:var(--ink-soft); font-size:11px;
    letter-spacing:0.05em; font-family:'Fraunces', serif; font-style:italic;
  }
</style>
</head>
<body>

<header>
  <span class="header-mark">VA</span>
  <div class="eyebrow">wander / index</div>
  <h1>Field <em>Notes</em></h1>
  <div class="intro">Photos and video from wherever I end up walking — street art, protest stickers, the odd wrestler-mask sculpture bolted to a wall. Each place gets its own page. Tap in to browse.</div>
</header>

<main>
  <div class="wall" id="wall"></div>
</main>

<footer>Field Notes, catalogued as I go</footer>

<script>
/* ============================================================
   PLACES — one card per city/location page.

   name   — display name
   slug   — folder name; also used to build the href (slug + "/")
   status — "live" (clickable, links to slug/) or "draft" (placeholder,
            not clickable yet — just shows on the homepage as a preview
            of what's coming)
   cover  — path to a cover image (e.g. "london/img/07-elephant-shutter.jpg"),
            or null for a placeholder thumb
   blurb  — one line under the name. Leave "" for a plain "notes coming
            soon" placeholder.
   count  — optional, e.g. "69 pieces" — shown as a small accent line

   To add a new city: copy one of the draft entries below, fill in the
   details, and flip status to "live" once that page actually exists.
   ============================================================ */
const PLACES = [
  {name:'London', slug:'london', status:'live', cover:'london/img/07-elephant-shutter.jpg', blurb:'Street art, stencils, wheatpaste and whatever else caught my eye on foot.', count:'69 pieces'},
  {name:'Khajuraho', slug:'khajuraho', status:'live', cover:'khajuraho/img/11-dusk-two-temples-pink-sky.jpg', blurb:'Sandstone temple towers, carved friezes and dusk skies over two days in Madhya Pradesh.', count:'26 pieces'},
  {name:'Concerts', slug:'concerts', status:'live', cover:'concerts/img/green-day.jpg', blurb:'Every gig I\'ve stood in a crowd for — artist by artist.', count:'16 shows'},
  {name:'Udupi', slug:'udupi', status:'live', cover:'udupi/img/05-sunset-lake.jpg', blurb:'Quiet lakes and backroads around Udupi, Karnataka.', count:'5 pieces'},
  {name:'Glasgow', slug:'glasgow', status:'draft', cover:null, blurb:'', count:''},
  {name:'Isle of Skye', slug:'skye', status:'draft', cover:null, blurb:'', count:''},
];

function renderWall(){
  const wall = document.getElementById('wall');
  wall.innerHTML = PLACES.map((p, i) => {
    const isLive = p.status === 'live';
    const coverStyle = p.cover ? `background-image:url('${p.cover}');` : '';
    const n = String(i + 1).padStart(2, '0');
    return `
    <div class="card ${isLive ? 'is-live' : 'is-draft'}" ${isLive ? `data-href="${p.slug}/"` : ''}>
      <div class="frame">
        <div class="tab">N° ${n}</div>
        <div class="thumb ${p.cover ? 'has-cover' : ''}" style="${coverStyle}">
          <div class="corner tl"></div>
          <div class="corner br"></div>
          <span class="status-badge ${isLive ? 'live' : 'draft'}">${isLive ? 'Filed' : 'Awaiting'}</span>
          ${!p.cover ? '<span class="glyph">no plate filed</span>' : ''}
        </div>
        <div class="meta">
          <div class="place-name">${p.name}</div>
          <hr class="rule">
          <div class="blurb ${p.blurb ? '' : 'tbd'}">${p.blurb || '— notes coming soon —'}</div>
          ${p.count ? `<span class="count">${p.count}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  wall.querySelectorAll('.card.is-live').forEach(el=>{
    el.onclick = () => { window.location.href = el.dataset.href; };
  });

  requestAnimationFrame(()=>{
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target);} });
    }, {threshold:0.15});
    wall.querySelectorAll('.card').forEach(c=>obs.observe(c));
  });
}

renderWall();
</script>

</body>
</html>
