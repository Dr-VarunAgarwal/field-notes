<style>
  :root{
    --iron:#1B1620;
    --stone:#221C29;
    --stone-2:#2C2434;
    --parchment:#EFE9DD;
    --parchment-dim:rgba(239,233,221,0.62);
    --parchment-faint:rgba(239,233,221,0.36);
    --heather:#8E7BA8;
    --rose:#B85C74;
    --sage:#7C8F6E;
    --silver:#9AA3AA;
    --line:rgba(239,233,221,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  img{ -webkit-touch-callout:none; }
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone);
    color:var(--parchment);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  a{ color:inherit; }

  header{
    background:linear-gradient(180deg, var(--iron) 0%, var(--stone) 70%, var(--stone-2) 100%);
    padding:34px 18px 12px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  header::before{
    content:"";
    position:absolute; inset:0; pointer-events:none; opacity:0.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,0.5), transparent 85%);
  }
  .header-top{
    position:absolute; top:14px; right:18px; z-index:2;
    display:flex; align-items:center; gap:8px;
  }
  .header-mark{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--heather);
    font-family:'Spectral', serif; font-style:italic; font-weight:500; font-size:14px;
    color:var(--heather);
  }
  .header-inner{position:relative; padding-right:0;}
  .eyebrow{
    font-size:11.5px; letter-spacing:0.18em; color:var(--parchment-dim);
    text-align:center; margin-bottom:10px; text-transform:uppercase;
  }
  .eyebrow a{color:var(--rose); text-decoration:none; border-bottom:1px dotted var(--rose);}
  h1{
    font-family:'Spectral', serif; font-weight:500; font-style:italic;
    font-size:clamp(52px, 16vw, 108px);
    letter-spacing:0.01em;
    margin:6px 0 10px;
    line-height:0.96;
    text-align:center;
    color:var(--parchment);
    position:relative;
  }
  .h1-rose{ color:var(--rose); font-style:normal; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:0.32em; vertical-align:middle; margin:0 0.15em; opacity:0.85; }
  .sub{
    color:var(--parchment-dim); font-size:13px; margin:0 auto 26px; max-width:48ch; line-height:1.65;
    text-align:center;
  }

  .filters{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; overflow-x:auto; padding:14px 0 4px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'Space Grotesk', sans-serif;
    font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    padding:8px 16px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--stone-2);
    color:var(--parchment-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--heather); color:#1B1620; border-color:var(--heather);
    font-weight:600;
  }

  .count{font-size:11px; color:var(--parchment-dim); padding:6px 0 2px; text-align:center;}
  .count b{color:var(--parchment);}

  main{padding:6px 14px 80px; max-width:1150px; margin:0 auto;}
  .wall{
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
    padding-top:18px;
  }
  @media(min-width:640px){
    .wall{ display:block; column-count:2; column-gap:26px; padding-top:28px; }
    .card{ break-inside:avoid; width:100%; margin-bottom:26px; }
  }
  @media(min-width:980px){
    .wall{ column-count:3; }
  }

  .card{
    opacity:0; transform:translateY(16px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease;
    cursor:pointer;
  }
  .card.in{opacity:1; transform:translateY(0);}
  @media(min-width:640px){
    .card:hover .frame{ box-shadow:0 22px 46px -20px rgba(0,0,0,0.65); border-color:rgba(142,123,168,0.4); }
  }

  .frame{
    position:relative;
    background:var(--stone-2);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 14px 32px -20px rgba(0,0,0,0.6);
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .frame::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: var(--frame-color, var(--heather)); opacity:0.9; z-index:2;
  }
  .card:active .frame{transform:scale(0.985); transition:transform .1s;}

  .thumb{
    width:100%; min-height:80px;
    background:var(--iron);
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none;
  }
  .thumb.has-photo{
    display:block;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .thumb .glyph{font-size:36px; opacity:0.8;}
  .thumb .ph-note{
    position:absolute; bottom:6px; left:6px; right:6px;
    font-size:9px; letter-spacing:0.04em; color:rgba(239,233,221,0.35);
    text-transform:uppercase;
  }
  .thumb::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,0.02), transparent 40%);
  }
  .wm-mark{
    position:absolute; z-index:3; pointer-events:none;
    bottom:10px; right:10px;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(27,22,32,0.55); backdrop-filter:blur(2px);
    border:1px solid rgba(239,233,221,0.25);
    font-family:'Spectral', serif; font-style:italic; font-size:12px;
    color:rgba(239,233,221,0.8);
  }
  .video-badge{
    position:absolute; top:8px; right:8px; z-index:2;
    background:rgba(0,0,0,0.55); color:var(--parchment);
    font-size:9px; letter-spacing:0.08em; padding:3px 7px; border-radius:2px;
    border:1px solid rgba(239,233,221,0.2);
  }

  .meta{padding:12px 13px 15px;}
  .meta .loc{
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--parchment-dim);
    display:flex; align-items:center; gap:5px; justify-content:space-between;
  }
  .meta .date{color:rgba(239,233,221,0.32);}
  .cat{
    font-family:'Spectral', serif; font-style:italic; font-size:13px;
    color:var(--rose); margin-top:7px;
  }
  .meta .title{
    font-family:'Space Grotesk', sans-serif; font-weight:500;
    font-size:15.5px; letter-spacing:0.005em; margin:4px 0 4px; line-height:1.25;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .tag{
    font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:3px 8px; border:1px solid var(--line); border-radius:2px; color:var(--parchment-dim);
  }

  .scrim{
    position:fixed; inset:0; background:rgba(10,8,12,0.75);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:100;
    backdrop-filter: blur(2px);
  }
  .scrim.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:101;
    background:var(--stone-2);
    border-top:1px solid var(--line);
    border-radius:10px 10px 0 0;
    padding:22px 20px 28px;
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-height:80vh; overflow-y:auto;
    box-shadow:0 -20px 50px rgba(0,0,0,0.5);
  }
  .drawer.open{transform:translateY(0);}
  .drawer-handle{
    width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;
  }
  .drawer .thumb{margin-bottom:16px; border-radius:2px;}
  .drawer .thumb video{ width:100%; display:block; max-height:52vh; object-fit:cover; }
  .drawer-close{
    position:absolute; top:16px; right:16px;
    background:none; border:1px solid var(--line); color:var(--parchment-dim);
    width:30px; height:30px; border-radius:100px; font-size:14px; cursor:pointer;
  }
  .d-loc{font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--parchment-dim); display:flex; justify-content:space-between; align-items:center;}
  .d-loc .date{color:rgba(239,233,221,0.35); letter-spacing:0.06em;}
  .d-title{font-family:'Spectral',serif; font-style:italic; font-weight:500; font-size:28px; margin:6px 0 12px; line-height:1.1;}
  .d-notes{font-size:13.5px; line-height:1.65; color:var(--parchment); white-space:pre-line;}
  .d-notes.notes-empty{color:var(--parchment-dim); font-style:italic;}
  .d-idea{
    margin-top:14px; padding:12px 13px;
    background:rgba(142,123,168,0.08);
    border:1px dashed rgba(142,123,168,0.3);
    border-radius:2px;
  }
  .d-idea .lbl{
    font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--heather); margin-bottom:5px; display:block;
  }
  .d-idea .txt{font-size:12.5px; line-height:1.55; color:var(--parchment-dim);}
  .d-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:16px;}

  footer{
    text-align:center; padding:30px 16px 60px; color:var(--parchment-dim); font-size:10.5px;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  footer a{color:var(--rose); text-decoration:none;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--parchment-dim); font-size:12px;
  }
</style>

/* ============================================================
   Rendering
   ============================================================ */
let activeCat = 'all';

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  const chips = [{id:'all', label:'All'}, ...CATEGORIES];
  wrap.innerHTML = chips.map(c => `
    <button class="chip ${activeCat===c.id?'active':''}" data-cat="${c.id}">${c.label}</button>
  `).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.onclick = () => { activeCat = el.dataset.cat; renderFilters(); renderWall(); };
  });
}

function thumbHTML(item, opts){
  opts = opts || {};
  const g = GLYPHS[item.category] || '📍';
  if(item.img){
    const ratioStyle = item.ratio ? `aspect-ratio:${item.ratio};` : '';
    return `
      <div class="thumb has-photo" style="${ratioStyle}background-image:url('${item.img}');" role="img" aria-label="${(item.title || item.category || 'photo').replace(/"/g,'&quot;')}">
        ${item.type==='video' ? '<div class="video-badge">▶ VIDEO</div>' : ''}
        <span class="wm-mark">${MONOGRAM_TEXT}</span>
      </div>
    `;
  }
  return `
    <div class="thumb">
      ${item.type==='video' ? '<div class="video-badge">▶ VIDEO</div>' : ''}
      <span class="glyph" style="font-size:${opts.size||36}px">${g}</span>
      <div class="ph-note">placeholder — add photo url</div>
    </div>
  `;
}

function renderWall(){
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const items = DATA
    .filter(d => activeCat==='all' || d.category===activeCat)
    .sort((a,b) => (a.order ?? 0) - (b.order ?? 0));

  count.innerHTML = `<b>${items.length}</b> piece${items.length===1?'':'s'}${activeCat!=='all' ? ' · ' + CATEGORIES.find(c=>c.id===activeCat).label : ''}`;

  if(items.length===0){
    wall.innerHTML=''; empty.style.display='block'; return;
  }
  empty.style.display='none';

  wall.innerHTML = items.map(item => {
    const frameStyle = item.colorFrame ? ` style="--frame-color:rgb(${item.colorFrame})"` : '';
    return `
    <div class="card" data-id="${item.id}">
      <div class="frame"${frameStyle} ${item.colorFrame ? `data-color-frame="1" data-img="${item.img}"` : ''}>
        <div style="position:relative;">
          ${thumbHTML(item)}
        </div>
        <div class="meta">
          <div class="loc"><span>📍 ${item.location}</span>${item.date ? `<span class="date">${formatDate(item.date)}</span>` : ''}</div>
          <div class="cat">${CATEGORIES.find(c=>c.id===item.category).label}</div>
          <div class="title">${item.title ? item.title : '— untitled —'}</div>
          <div class="tags">
            ${item.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  wall.querySelectorAll('.card').forEach(el=>{
    el.onclick = () => openDrawer(parseInt(el.dataset.id));
  });

  applyColorFrames();

  requestAnimationFrame(()=>{
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target);} });
    }, {threshold:0.15});
    wall.querySelectorAll('.card').forEach(c=>obs.observe(c));
  });
}

/* ============================================================
   Colour-sampled frames — refines each flagged card's frame colour by
   re-reading the actual photo pixels in the browser (never uploads
   anywhere). The DATA colorFrame value is already a real colour picked
   from the image, so this only improves on it when it can.
   ============================================================ */
function rgbToHsv(r, g, b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d!==0){
    if(mx===r) h = ((g-b)/d) % 6;
    else if(mx===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if(h<0) h+=360;
  }
  return [h/360, mx===0?0:d/mx, mx];
}
function hsvToRgb(h,s,v){
  const i = Math.floor(h*6), f = h*6-i;
  const p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0: r=v;g=t;b=p; break; case 1: r=q;g=v;b=p; break;
    case 2: r=p;g=v;b=t; break; case 3: r=p;g=q;b=v; break;
    case 4: r=t;g=p;b=v; break; default: r=v;g=p;b=q;
  }
  return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
}
function extractVividColor(url, callback){
  const img = new Image();
  img.onload = () => {
    try{
      const size = 48;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      let cutoff = 0.45;
      let best = null;
      while(!best && cutoff > 0.1){
        const bins = {};
        for(let i=0; i<data.length; i+=4){
          const [h,s,v] = rgbToHsv(data[i], data[i+1], data[i+2]);
          if(s < cutoff || v < 0.2) continue;
          const bi = Math.floor(h*24) % 24;
          const w = s*v;
          if(!bins[bi]) bins[bi] = {w:0, r:0, g:0, b:0};
          bins[bi].w += w; bins[bi].r += data[i]*w; bins[bi].g += data[i+1]*w; bins[bi].b += data[i+2]*w;
        }
        const keys = Object.keys(bins);
        if(keys.length){
          best = keys.reduce((a,b)=> bins[a].w > bins[b].w ? a : b);
          best = bins[best];
        } else {
          cutoff -= 0.1;
        }
      }
      if(!best) return;
      let r = best.r/best.w, g = best.g/best.w, b = best.b/best.w;
      let [h,s,v] = rgbToHsv(r,g,b);
      s = Math.min(1, s*1.2); v = Math.min(1, Math.max(v, 0.55));
      const [fr,fg,fb] = hsvToRgb(h,s,v);
      callback(`rgb(${fr},${fg},${fb})`);
    } catch(e){ /* canvas blocked — baked-in colour stays */ }
  };
  img.src = url;
}

function applyColorFrames(){
  document.querySelectorAll('[data-color-frame="1"]').forEach(frameEl => {
    const url = frameEl.dataset.img;
    if(!url || frameEl.dataset.colorApplied) return;
    frameEl.dataset.colorApplied = '1';
    extractVividColor(url, (color) => {
      frameEl.style.setProperty('--frame-color', color);
    });
  });
}

function openDrawer(id){
  const item = DATA.find(d=>d.id===id);
  if(!item) return;

  const dThumb = document.getElementById('dThumb');
  if(item.type === 'video' && item.video){
    dThumb.innerHTML = `<video src="${item.video}" ${item.img ? `poster="${item.img}"` : ''} controls playsinline style="width:100%;display:block;max-height:52vh;object-fit:cover;"></video>`;
  } else {
    dThumb.innerHTML = thumbHTML(item, {size:44});
  }

  document.getElementById('dLoc').innerHTML = `<span>📍 ${item.location}</span>${item.date ? `<span class="date">${formatDate(item.date)}</span>` : ''}`;
  document.getElementById('dTitle').textContent = item.title ? item.title : '— untitled —';

  const notesEl = document.getElementById('dNotes');
  if(item.notes && item.notes.trim()){
    notesEl.textContent = item.notes;
    notesEl.classList.remove('notes-empty');
  } else {
    notesEl.textContent = '— add your notes —';
    notesEl.classList.add('notes-empty');
  }

  const ideaEl = document.getElementById('dIdea');
  if(item.claudeIdea && item.claudeIdea.trim()){
    ideaEl.style.display = 'block';
    document.getElementById('dIdeaText').textContent = item.claudeIdea;
  } else {
    ideaEl.style.display = 'none';
  }

  document.getElementById('dTags').innerHTML = [
    `<span class="tag">${CATEGORIES.find(c=>c.id===item.category).label}</span>`,
    ...item.tags.map(t=>`<span class="tag">${t}</span>`)
  ].join('');

  document.getElementById('scrim').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  const v = document.querySelector('#dThumb video');
  if(v) v.pause();
}

document.getElementById('scrim').onclick = closeDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;

renderFilters();
renderWall();

document.addEventListener('contextmenu', (e) => { if(e.target.closest('.thumb')) e.preventDefault(); });
document.addEventListener('dragstart', (e) => { if(e.target.closest('.thumb')) e.preventDefault(); });

</script>
