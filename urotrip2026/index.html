<script>
/* ============ perforated stamp shape (full-size stamp view) ============ */
function buildClipPathFrac(w, h, pitchTarget, rRatio){
  const nx = Math.max(2, Math.round(w / pitchTarget));
  const ny = Math.max(2, Math.round(h / pitchTarget));
  const px = w / nx, py = h / ny;
  const r = (Math.min(px, py) / 2) * rRatio;
  const rx = r / w, ry = r / h;
  const fx = v => v / w, fy = v => v / h;
  const ellipse = (cx, cy) => {
    const cxf = fx(cx), cyf = fy(cy);
    return `M${(cxf-rx).toFixed(5)},${cyf.toFixed(5)} ` +
           `A${rx.toFixed(5)},${ry.toFixed(5)} 0 1,0 ${(cxf+rx).toFixed(5)},${cyf.toFixed(5)} ` +
           `A${rx.toFixed(5)},${ry.toFixed(5)} 0 1,0 ${(cxf-rx).toFixed(5)},${cyf.toFixed(5)} Z `;
  };
  let d = `M0,0 H1 V1 H0 Z `;
  for (let k = 0; k <= nx; k++) { d += ellipse(k*px, 0); d += ellipse(k*px, h); }
  for (let k = 0; k <= ny; k++) { d += ellipse(0, k*py); d += ellipse(w, k*py); }
  return d;
}
document.getElementById('stampClipPath').setAttribute(
  'd', buildClipPathFrac(164, 134, 6, 0.78)
);

/* ============ perforated stamp shape (mini stamp on a postcard) ============ */
function generatePaperSVG(w, h){
  const pitch = 14;
  const r = 3.5;
  const nx = Math.floor(w / pitch);
  const ny = Math.floor(h / pitch);
  const actualPitchX = w / nx;
  const actualPitchY = h / ny;

  let d = `M 0,0 `;
  for(let i=1; i<=nx; i++){
    const cx = i * actualPitchX - (actualPitchX/2);
    d += `L ${cx - r},0 A ${r},${r} 0 0,0 ${cx + r},0 `;
  }
  d += `L ${w},0 `;
  for(let i=1; i<=ny; i++){
    const cy = i * actualPitchY - (actualPitchY/2);
    d += `L ${w},${cy - r} A ${r},${r} 0 0,0 ${w},${cy + r} `;
  }
  d += `L ${w},${h} `;
  for(let i=nx; i>=1; i--){
    const cx = i * actualPitchX - (actualPitchX/2);
    d += `L ${cx + r},${h} A ${r},${r} 0 0,0 ${cx - r},${h} `;
  }
  d += `L 0,${h} `;
  for(let i=ny; i>=1; i--){
    const cy = i * actualPitchY - (actualPitchY/2);
    d += `L 0,${cy + r} A ${r},${r} 0 0,0 0,${cy - r} `;
  }
  d += `Z`;
  return `<svg viewBox="0 0 ${w} ${h}" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`;
}
const pcStampSVG = generatePaperSVG(180, 150);

function svgArt(seed, colorB){
  const shapes = [
    `<circle cx="90" cy="55" r="42" fill="${colorB}" opacity="0.3"/>`,
    `<path d="M0,150 L60,90 L120,140 L180,80 L180,150 Z" fill="${colorB}" opacity="0.26"/>`,
    `<rect x="18" y="18" width="144" height="3" fill="${colorB}" opacity="0.35"/>`,
    `<circle cx="36" cy="115" r="9" fill="${colorB}" opacity="0.4"/><circle cx="148" cy="28" r="5" fill="${colorB}" opacity="0.4"/>`,
    `<path d="M40,40 Q90,10 140,40 T140,110 Q90,140 40,110 Z" fill="${colorB}" opacity="0.25"/>`,
  ];
  const s = shapes[seed % shapes.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='180' height='150'>${s}</svg>`;
  return `data:image/svg+xml;base64,${btoa(svg)}`;
}

/* ============ STAMP VIEW: tile builder ============ */
const STAMP_SIZES = { sm: [140,117], md: [180,150], lg: [224,187] };
function stampSizeFor(idx){
  const pattern = ['md','sm','lg','sm','md','lg','lg','sm','md','md','sm','lg'];
  return pattern[idx % pattern.length];
}
function captionHTML(item, pal){
  const filler = item.title.length < 20
    ? `<div class="cap-filler">${item.desc.split('.')[0]}.</div>`
    : '';
  return `
    <div class="stamp-caption" style="--accent:${pal.paper};">
      <div class="cap-kicker-row">
        <span class="cap-kicker">${item.kicker}</span>
        <span class="cap-rule"></span>
      </div>
      <div class="cap-title">${item.title}</div>
      <div class="cap-meta">${item.location.split(',')[0]} · ${item.date}</div>
      ${filler}
    </div>`;
}
function stampHTML(idx, centerX, centerY){
  const item = items[idx % items.length];
  const pal = palette[idx % palette.length];
  const sizeKey = stampSizeFor(idx);
  const [w, h] = STAMP_SIZES[sizeKey];
  const x = centerX - w/2, y = centerY - h/2;
  return `
    <div class="stamp size-${sizeKey}" data-idx="${idx}" style="left:${x}px; top:${y}px; --paper:${pal.paper}; --ink:${pal.ink};">
      <div class="stamp-lift">
        <div class="stamp-shadow"></div>
        <div class="stamp-paper"></div>
        <div class="stamp-inner">
          <img class="stamp-art" src="${svgArt(idx, pal.ink)}" alt="">
          <div class="stamp-mark">${item.mark}</div>
          <div class="stamp-top"><div class="stamp-kicker">${item.kicker}</div></div>
          <div class="stamp-bottom">
            <div class="stamp-title">${item.title}</div>
            <div class="stamp-byline">${item.byline}</div>
          </div>
        </div>
      </div>
      ${captionHTML(item, pal)}
    </div>`;
}

/* ============ POSTCARD VIEW: tile builder ============ */
function pcStampBadgeHTML(idx, pal, rot){
  const item = items[idx % items.length];
  return `
    <div class="pc-stamp-wrapper" style="transform: scale(0.32) rotate(${rot}deg);">
       <div class="pc-stamp-box" style="--paper:${pal.paper}; --ink:${pal.ink};">
         <div class="pc-stamp-paper">${pcStampSVG}</div>
         <div class="pc-stamp-inner">
           <img class="pc-stamp-art" src="${svgArt(idx, pal.ink)}" alt="">
           <div class="pc-stamp-mark">${item.mark}</div>
           <div class="pc-stamp-top"><div class="pc-stamp-kicker">${item.kicker}</div></div>
         </div>
       </div>
    </div>`;
}
const POSTCARD_DIMS = {
  landscape: { w:340, h:250, photoH:160 },
  portrait:  { w:230, h:320, photoH:210 },
};
function postcardHTML(idx, centerX, centerY){
  const item = items[idx % items.length];
  const pal = palette[idx % palette.length];

  const rot = (Math.sin(idx * 13) * 6).toFixed(1);
  const ox = Math.sin(idx * 7) * 20;
  const oy = Math.cos(idx * 11) * 20;

  const dims = POSTCARD_DIMS[item.orientation === 'portrait' ? 'portrait' : 'landscape'];
  const { w, h, photoH } = dims;
  const x = centerX - w/2 + ox;
  const y = centerY - h/2 + oy;

  const stampRot = (Math.cos(idx * 5) * 8).toFixed(1);

  return `
    <div class="postcard" data-idx="${idx}" style="left:${x}px; top:${y}px; width:${w}px; height:${h}px; transform: rotate(${rot}deg);">
      <div class="postcard-lift">
        <img class="pc-photo" src="${item.photo || svgArt(idx + 10, '#999')}" alt="" style="height:${photoH}px;">
        <div class="pc-content">
          <div class="pc-title">${item.title}</div>
          ${item.artist ? `<div class="pc-artist">${item.artist}</div>` : ''}
          <div class="pc-byline">${item.byline} · ${item.date}</div>
        </div>
        ${pcStampBadgeHTML(idx, pal, stampRot)}
      </div>
    </div>`;
}

/* ============ view switching + shared drag-canvas engine ============ */
const VIEWS = {
  stamps:    { cellW:300, cellH:300, cols:6, rows:4, build:stampHTML },
  postcards: { cellW:520, cellH:460, cols:5, rows:3, build:postcardHTML },
};
let currentView = 'postcards';

const canvasEl = document.getElementById('canvas');
const viewportEl = document.getElementById('viewport');
const toggleBtn = document.getElementById('view-toggle');

function otherView(){ return currentView === 'postcards' ? 'stamps' : 'postcards'; }
function updateToggleLabel(){ toggleBtn.textContent = otherView(); }

/* each tile position gets its own base offset into `items`, rather than
   every tile repeating the same fixed slice — otherwise only the first
   rows*cols items could ever appear, no matter how far you drag.
   The offset comes from a hash of (tx,ty), not linear arithmetic — a
   constant per-tile step (old: (ty*10000+tx)*cellsPerUnit) is only ever
   as scrambled as gcd(step, items.length) allows, so with real item
   counts it fell into a short, visibly repeating cycle every few tiles. */
function hashTile(tx, ty){
  let h = (tx * 374761393 + ty * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 15), 2246822519);
  h = Math.imul(h ^ (h >>> 13), 3266489917);
  h ^= h >>> 16;
  return h >>> 0;
}
function buildTileHTML(v, baseIdx){
  let idx = baseIdx, html = '';
  for (let r = 0; r < v.rows; r++) {
    for (let c = 0; c < v.cols; c++) {
      const centerX = c * v.cellW + v.cellW/2;
      const centerY = r * v.cellH + v.cellH/2;
      html += v.build(idx, centerX, centerY);
      idx++;
    }
  }
  return html;
}

function buildTiles(){
  const v = VIEWS[currentView];
  const unitW = v.cols * v.cellW;
  const unitH = v.rows * v.cellH;
  canvasEl.innerHTML = '';
  const nx = Math.ceil(window.innerWidth / unitW) + 4;
  const ny = Math.ceil(window.innerHeight / unitH) + 4;
  for (let ty = -2; ty < ny - 2; ty++) {
    for (let tx = -2; tx < nx - 2; tx++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.transform = `translate(${tx * unitW}px, ${ty * unitH}px)`;
      const tileOffset = hashTile(tx, ty);
      tile.innerHTML = buildTileHTML(v, tileOffset);
      canvasEl.appendChild(tile);
    }
  }
}

toggleBtn.addEventListener('click', () => {
  currentView = otherView();
  updateToggleLabel();
  buildTiles();
});
updateToggleLabel();
buildTiles();

/* ============ drag-to-pan with momentum (shared by both views) ============ */
let panX = 0, panY = 0;
let isDown = false, startX, startY, startPanX, startPanY, dragMoved = false;
let lastX = 0, lastY = 0, velocityX = 0, velocityY = 0, lastTime = 0;
let animId = null;

function currentUnit(){
  const v = VIEWS[currentView];
  return { unitW: v.cols * v.cellW, unitH: v.rows * v.cellH };
}
function applyPan(){
  const { unitW, unitH } = currentUnit();
  const wrappedX = ((panX % unitW) + unitW) % unitW;
  const wrappedY = ((panY % unitH) + unitH) % unitH;
  canvasEl.style.transform = `translate(${wrappedX}px, ${wrappedY}px)`;
}
applyPan();

function pointerDown(x, y){
  if (animId) cancelAnimationFrame(animId);
  isDown = true; dragMoved = false;
  startX = x; startY = y;
  startPanX = panX; startPanY = panY;
  lastX = x; lastY = y;
  lastTime = performance.now();
  velocityX = 0; velocityY = 0;
  viewportEl.classList.add('dragging');
}
function pointerMove(x, y){
  if (!isDown) return;
  const dx = x - startX, dy = y - startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  const now = performance.now();
  const dt = now - lastTime;
  if (dt > 0) { velocityX = (x - lastX) / dt * 16; velocityY = (y - lastY) / dt * 16; }
  lastX = x; lastY = y; lastTime = now;
  panX = startPanX + dx;
  panY = startPanY + dy;
  applyPan();
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = 0;
}
function pointerUp(){
  if (!isDown) return;
  isDown = false;
  viewportEl.classList.remove('dragging');
  function step(){
    if (Math.abs(velocityX) > 0.2 || Math.abs(velocityY) > 0.2) {
      panX += velocityX; panY += velocityY;
      velocityX *= 0.92; velocityY *= 0.92;
      applyPan();
      animId = requestAnimationFrame(step);
    }
  }
  animId = requestAnimationFrame(step);
}

viewportEl.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
window.addEventListener('mouseup', pointerUp);
viewportEl.addEventListener('touchstart', e => { const t = e.touches[0]; pointerDown(t.clientX, t.clientY); }, {passive:true});
viewportEl.addEventListener('touchmove', e => { const t = e.touches[0]; pointerMove(t.clientX, t.clientY); }, {passive:true});
viewportEl.addEventListener('touchend', pointerUp);
viewportEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  panX -= e.deltaX; panY -= e.deltaY;
  applyPan();
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = 0;
}, {passive:false});

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildTiles, 150); });

/* ============ sidebar ============ */
canvasEl.addEventListener('click', (e) => {
  if (dragMoved) return;
  const stampEl = e.target.closest('.stamp');
  const postcardEl = e.target.closest('.postcard');
  if (stampEl) {
    const idx = +stampEl.dataset.idx;
    openStampSidebar(items[idx % items.length], palette[idx % palette.length]);
  } else if (postcardEl) {
    const idx = +postcardEl.dataset.idx;
    openPostcardSidebar(items[idx % items.length], palette[idx % palette.length], idx);
  }
});

      <div class="sb-title">${item.title}</div>
      <div class="sb-desc">${item.desc}</div>
      <div class="sb-meta">
        <div class="sb-meta-item"><div class="sb-meta-label">Location</div><div class="sb-meta-value">${item.location}</div></div>
        <div class="sb-meta-item"><div class="sb-meta-label">Date</div><div class="sb-meta-value">${item.date}</div></div>
        <div class="sb-meta-item"><div class="sb-meta-label">Neighborhood</div><div class="sb-meta-value">${item.byline}</div></div>
      </div>
    </div>
  `;
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function openPostcardSidebar(item, pal, idx){
  const inner = document.getElementById('sidebarInner');
  const dims = POSTCARD_DIMS[item.orientation === 'portrait' ? 'portrait' : 'landscape'];
  inner.innerHTML = `
    <div class="sb-postcard-wrap">
      <div class="postcard" style="transform:rotate(0deg); width:${dims.w}px; height:${dims.h}px;">
        <div class="postcard-lift" style="transform:none; cursor:default;">
          <img class="pc-photo" src="${item.photo || svgArt(idx + 10, '#999')}" alt="" style="height:${dims.photoH}px;">
          <div class="pc-content">
            <div class="pc-title">${item.title}</div>
            ${item.artist ? `<div class="pc-artist">${item.artist}</div>` : ''}
            <div class="pc-byline">${item.byline} · ${item.date}</div>
          </div>
          ${pcStampBadgeHTML(idx, pal, -2)}
        </div>
      </div>
    </div>
    <div class="sb-body">
      <div class="sb-kicker">${item.kicker}</div>
      <div class="sb-title">${item.title}</div>
      <div class="sb-desc">${item.desc}</div>
      <div class="sb-meta">
        ${item.artist ? `<div class="sb-meta-item"><div class="sb-meta-label">Artist</div><div class="sb-meta-value">${item.artist}</div></div>` : ''}
        <div class="sb-meta-item"><div class="sb-meta-label">Location</div><div class="sb-meta-value">${item.location}</div></div>
        <div class="sb-meta-item"><div class="sb-meta-label">Date</div><div class="sb-meta-value">${item.date}</div></div>
        <div class="sb-meta-item"><div class="sb-meta-label">Neighborhood</div><div class="sb-meta-value">${item.byline}</div></div>
      </div>
    </div>
  `;
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
</script>
</body>
</html>
